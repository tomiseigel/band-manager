<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101113"><link rel="manifest" href="manifest.webmanifest">
<title>Band Manager</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f5f6;background:#101113}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;background:#292c31;color:#fff}button.primary{background:#1ed760;color:#09140d;font-weight:700}button.danger{background:#53252c}input,select{background:#22252a;border:1px solid #444a50;color:#fff;border-radius:8px;padding:11px;width:100%;min-width:0}label{display:block;font-size:13px;color:#b8bec3;margin:10px 0 5px}.shell{max-width:1000px;margin:auto;padding:20px 16px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.green{color:#1ed760}.muted{color:#aeb4b9}.small{font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin:24px 0 18px;padding-bottom:4px}.nav button{white-space:nowrap}.nav button.active{background:#1ed760;color:#101113}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#1b1e22;border:1px solid #30343a;border-radius:14px;padding:17px;margin-bottom:14px}.metric{font-size:26px;font-weight:800;margin-top:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #36393e}.item:last-child{border:0}.pill{font-size:12px;color:#1ed760;background:#173b28;border-radius:30px;padding:5px 9px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.bar{height:8px;background:#373b40;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#1ed760}.empty{color:#aeb4b9;padding:15px 0}.hide{display:none!important}h1{font-size:27px;margin:14px 0}h2{font-size:18px;margin:0 0 13px}h3{font-size:16px;margin:0 0 7px}.modal{border:1px solid #4a5057;background:#1b1e22;color:white;border-radius:16px;width:min(95%,520px);max-height:90%;overflow:auto;padding:22px}.modal::backdrop{background:#000b}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12px;color:#adb4b9;margin-top:8px}footer{font-size:12px;color:#9fa7ad;margin-top:25px}@media(max-width:580px){.grid{grid-template-columns:1fr 1fr}.cols,.formrow{grid-template-columns:1fr}.brand{font-size:20px}.metric{font-size:22px}} 
</style></head><body><div class="shell">
<header class="top"><div><div class="brand">BAND<span class="green">MANAGER</span></div><div class="muted small" id="subtitle">Gestión para bandas</div></div><select id="lang" aria-label="Language" style="width:110px"><option value="es">Español</option><option value="en">English</option></select></header>
<div class="row" style="margin-top:22px"><div style="min-width:190px;flex:1"><label id="bandLabel" for="band">Banda activa</label><select id="band"></select></div><button id="addBand" class="primary" style="align-self:end">+ Banda</button></div>
<nav class="nav" id="nav"><button data-tab="home" class="active">Inicio</button><button data-tab="shows">Conciertos</button><button data-tab="tasks">Tareas</button><button data-tab="finance">Finanzas</button><button data-tab="settings">Ajustes</button></nav>
<main id="content"></main><footer id="foot">Versión 0.1 · Los datos se guardan en este navegador. No hay sincronización entre dispositivos.</footer>
</div>
<dialog id="dialog" class="modal"><h2 id="dialogTitle"></h2><form id="form"><div id="fields"></div><div class="actions"><button type="submit" class="primary" id="saveBtn">Guardar</button><button type="button" id="cancel">Cancelar</button></div></form></dialog>
<script>
const KEY='bandmanager-v01';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!data||!Array.isArray(data.bands))data={bands:[{id:'palta',name:'Palta and the Mood'}],shows:[],tasks:[],finance:[],bandId:'palta',lang:'es'};
let tab='home',formType='',editing=null;
const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,11),save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const tr={es:{sub:'Gestión para bandas',band:'Banda activa',addBand:'+ Banda',home:'Inicio',shows:'Conciertos',tasks:'Tareas',finance:'Finanzas',settings:'Ajustes',save:'Guardar',cancel:'Cancelar',next:'Próximos conciertos',pending:'Tareas pendientes',balance:'Balance',sold:'Entradas vendidas',newShow:'+ Concierto',newTask:'+ Tarea',newFinance:'+ Movimiento',noShows:'Todavía no hay conciertos. Agregá el primero.',noTasks:'Todavía no hay tareas.',noFinance:'Todavía no hay movimientos.',date:'Fecha',venue:'Sala / lugar',capacity:'Capacidad',goal:'Objetivo de ventas',tickets:'Entradas vendidas',ticketing:'Ticketera(s)',ticketUrl:'Enlace de venta',name:'Nombre',due:'Vencimiento',status:'Estado',open:'Pendiente',done:'Terminada',amount:'Monto',type:'Tipo',income:'Ingreso',expense:'Gasto',note:'Concepto',remove:'Eliminar',edit:'Editar',export:'Exportar respaldo',import:'Importar respaldo',local:'Versión 0.1 · Los datos se guardan en este navegador. No hay sincronización entre dispositivos.',lang:'Idioma',bands:'Bandas',confirm:'¿Eliminar este registro?',noDate:'Sin fecha',all:'Total de conciertos',currency:'Moneda (etiqueta)',paid:'Pagos y movimientos',help:'Podés escribir varias ticketeras separadas por comas. Las ventas se cargan manualmente por ahora.',backup:'Hacé respaldos periódicos: borrar los datos del navegador puede eliminar la información.',noSync:'Sin conexión automática con ticketeras todavía.'},
en:{sub:'Management for bands',band:'Active band',addBand:'+ Band',home:'Home',shows:'Shows',tasks:'Tasks',finance:'Finances',settings:'Settings',save:'Save',cancel:'Cancel',next:'Upcoming shows',pending:'Pending tasks',balance:'Balance',sold:'Tickets sold',newShow:'+ Show',newTask:'+ Task',newFinance:'+ Transaction',noShows:'No shows yet. Add your first one.',noTasks:'No tasks yet.',noFinance:'No transactions yet.',date:'Date',venue:'Venue',capacity:'Capacity',goal:'Sales goal',tickets:'Tickets sold',ticketing:'Ticket platform(s)',ticketUrl:'Ticket link',name:'Name',due:'Due date',status:'Status',open:'Open',done:'Done',amount:'Amount',type:'Type',income:'Income',expense:'Expense',note:'Description',remove:'Delete',edit:'Edit',export:'Export backup',import:'Import backup',local:'Version 0.1 · Data is stored in this browser. No device sync.',lang:'Language',bands:'Bands',confirm:'Delete this record?',noDate:'No date',all:'Total shows',currency:'Currency (label)',paid:'Payments and transactions',help:'You can list several ticket platforms separated by commas. Sales are entered manually for now.',backup:'Back up regularly: clearing browser data may erase your information.',noSync:'Automatic ticket integration is not available yet.'}};
const t=k=>tr[data.lang][k]||k,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat(data.lang==='es'?'es-AR':'en-US',{maximumFractionDigits:2}).format(n||0),active=a=>data[a].filter(x=>x.bandId===data.bandId),button=(label,action,key)=>`<button data-action="${action}" data-id="${key||''}">${label}</button>`;
function render(){document.documentElement.lang=data.lang;$('#subtitle').textContent=t('sub');$('#bandLabel').textContent=t('band');$('#addBand').textContent=t('addBand');$('#lang').value=data.lang;$('#band').innerHTML=data.bands.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('');$('#band').value=data.bandId;$('#foot').textContent=t('local');document.querySelectorAll('#nav button').forEach(b=>{b.textContent=t(b.dataset.tab);b.classList.toggle('active',b.dataset.tab===tab)});let shows=active('shows').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')),tasks=active('tasks'),fin=active('finance'),balance=fin.reduce((s,x)=>s+(x.type==='income'?1:-1)*Number(x.amount||0),0),sold=shows.reduce((s,x)=>s+Number(x.tickets||0),0);
let metrics=`<div class="grid"><div class="card"><div class="muted small">${t('all')}</div><div class="metric">${shows.length}</div></div><div class="card"><div class="muted small">${t('pending')}</div><div class="metric">${tasks.filter(x=>x.status!=='done').length}</div></div><div class="card"><div class="muted small">${t('sold')}</div><div class="metric">${sold}</div></div></div>`;
let showItem=x=>{let cap=Number(x.capacity)||0,goal=Number(x.goal)||0,n=Number(x.tickets)||0;return `<div class="item"><div class="row"><div><h3>${esc(x.name)}</h3><div class="muted small">${esc(x.date||t('noDate'))} · ${esc(x.venue||'—')}</div></div><span class="pill">${n} / ${goal||cap||'—'}</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,100*n/(goal||cap||1)))}%"></div></div><div class="muted small" style="margin-top:8px">${esc(x.ticketing||'—')}${x.ticketUrl?' · <a style="color:#1ed760" target="_blank" rel="noopener noreferrer" href="'+esc(/^https?:\/\//i.test(x.ticketUrl)?x.ticketUrl:'#')+'">Tickets ↗</a>':''}</div><div class="actions">${button(t('edit'),'editShow',x.id)}${button(t('remove'),'deleteShow',x.id)}</div></div>`};
let taskItem=x=>`<div class="item row"><div><strong>${esc(x.name)}</strong><div class="muted small">${esc(x.due||t('noDate'))} · ${t(x.status||'open')}</div></div><div class="actions">${button(x.status==='done'?'↩':'✓','toggleTask',x.id)}${button(t('edit'),'editTask',x.id)}${button('×','deleteTask',x.id)}</div></div>`;
let finItem=x=>`<div class="item row"><div><strong>${esc(x.note)}</strong><div class="muted small">${esc(x.date||t('noDate'))}</div></div><div><strong style="color:${x.type==='income'?'#1ed760':'#ff9999'}">${x.type==='income'?'+':'−'} ${money(x.amount)} ${esc(x.currency||'ARS')}</strong><div class="actions">${button(t('edit'),'editFinance',x.id)}${button('×','deleteFinance',x.id)}</div></div></div>`;
let content='';
if(tab==='home')content=metrics+`<div class="cols"><section class="card"><div class="row"><h2>${t('next')}</h2>${button('+','newShow')}</div>${shows.filter(x=>!x.date||x.date>=new Date().toISOString().slice(0,10)).slice(0,3).map(showItem).join('')||`<div class="empty">${t('noShows')}</div>`}</section><section class="card"><div class="row"><h2>${t('pending')}</h2>${button('+','newTask')}</div>${tasks.filter(x=>x.status!=='done').slice(0,5).map(taskItem).join('')||`<div class="empty">${t('noTasks')}</div>`}</section></div><div class="card"><div class="muted">${t('balance')} (ARS, movimientos etiquetados)</div><div class="metric">${money(balance)}</div></div>`;
if(tab==='shows')content=`<div class="row"><h1>${t('shows')}</h1><button class="primary" data-action="newShow">${t('newShow')}</button></div><div class="card"><div class="hint">${t('help')}</div>${shows.map(showItem).join('')||`<div class="empty">${t('noShows')}</div>`}</div>`;
if(tab==='tasks')content=`<div class="row"><h1>${t('tasks')}</h1><button class="primary" data-action="newTask">${t('newTask')}</button></div><div class="card">${tasks.map(taskItem).join('')||`<div class="empty">${t('noTasks')}</div>`}</div>`;
if(tab==='finance')content=`<div class="row"><h1>${t('finance')}</h1><button class="primary" data-action="newFinance">${t('newFinance')}</button></div><div class="card"><div class="muted">${t('balance')} (suma numérica; no convierte monedas)</div><div class="metric">${money(balance)}</div></div><div class="card">${fin.map(finItem).join('')||`<div class="empty">${t('noFinance')}</div>`}</div>`;
if(tab==='settings')content=`<h1>${t('settings')}</h1><div class="card"><h2>${t('bands')}</h2>${data.bands.map(x=>`<div class="item">${esc(x.name)}</div>`).join('')}<div class="actions"><button data-action="newBand">${t('addBand')}</button></div></div><div class="card"><h2>Backup / Respaldo</h2><p class="muted small">${t('backup')}</p><div class="actions"><button data-action="export">${t('export')}</button><button data-action="import">${t('import')}</button><input class="hide" type="file" id="importFile" accept=".json,application/json"></div></div><div class="card"><p class="muted">${t('noSync')}</p></div>`;
$('#content').innerHTML=content}
function field(name,label,type='text',value='',extra=''){return `<label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function select(name,label,options,value){return `<label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select>`}
function modal(type,obj){formType=type;editing=obj?.id||null;$('#dialogTitle').textContent=type==='band'?t('addBand'):type==='show'?t('shows'):type==='task'?t('tasks'):t('finance');let f='';
if(type==='band')f=field('name',t('name'),'text',obj?.name,'required');
if(type==='show')f=field('name',t('name'),'text',obj?.name,'required')+field('date',t('date'),'date',obj?.date)+field('venue',t('venue'),'text',obj?.venue)+`<div class="formrow"><div>${field('capacity',t('capacity'),'number',obj?.capacity||0,'min="0"')}</div><div>${field('goal',t('goal'),'number',obj?.goal||0,'min="0"')}</div></div>`+field('tickets',t('tickets'),'number',obj?.tickets||0,'min="0"')+field('ticketing',t('ticketing'),'text',obj?.ticketing)+field('ticketUrl',t('ticketUrl'),'url',obj?.ticketUrl);
if(type==='task')f=field('name',t('name'),'text',obj?.name,'required')+field('due',t('due'),'date',obj?.due)+select('status',t('status'),[['open',t('open')],['done',t('done')]],obj?.status||'open');
if(type==='finance')f=field('note',t('note'),'text',obj?.note,'required')+field('date',t('date'),'date',obj?.date)+select('type',t('type'),[['income',t('income')],['expense',t('expense')]],obj?.type||'income')+field('amount',t('amount'),'number',obj?.amount||0,'min="0" step="0.01"')+select('currency',t('currency'),[['ARS','ARS'],['USD','USD'],['EUR','EUR'],['BRL','BRL']],obj?.currency||'ARS');
$('#fields').innerHTML=f;$('#saveBtn').textContent=t('save');$('#cancel').textContent=t('cancel');$('#dialog').showModal()}
$('#form').addEventListener('submit',e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target).entries());if(formType==='band'){const b={id:id(),name:vals.name.trim()};data.bands.push(b);data.bandId=b.id}else{let key={show:'shows',task:'tasks',finance:'finance'}[formType];if(!key)return;for(let k of ['capacity','goal','tickets','amount'])if(k in vals)vals[k]=Math.max(0,Number(vals[k])||0);let old=data[key].find(x=>x.id===editing);if(old)Object.assign(old,vals);else data[key].push({id:id(),bandId:data.bandId,...vals})}save();$('#dialog').close();render()});
$('#cancel').onclick=()=>$('#dialog').close();
$('#lang').onchange=e=>{data.lang=e.target.value;save();render()};
$('#band').onchange=e=>{data.bandId=e.target.value;save();render()};
$('#addBand').onclick=()=>modal('band');
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action,key=b.dataset.id,types={Show:'shows',Task:'tasks',Finance:'finance'};if(a==='newBand')return modal('band');if(a==='newShow')return modal('show');if(a==='newTask')return modal('task');if(a==='newFinance')return modal('finance');if(a==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='band-manager-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import')return $('#importFile').click();if(a==='toggleTask'){let x=data.tasks.find(x=>x.id===key);if(x)x.status=x.status==='done'?'open':'done';save();return render()}for(let [suffix,collection] of Object.entries(types)){if(a==='edit'+suffix)return modal(suffix.toLowerCase()==='show'?'show':suffix.toLowerCase(),data[collection].find(x=>x.id===key));if(a==='delete'+suffix){if(confirm(t('confirm'))){data[collection]=data[collection].filter(x=>x.id!==key);save();render()}return}}});
$('#content').addEventListener('change',async e=>{if(e.target.id!=='importFile')return;try{let parsed=JSON.parse(await e.target.files[0].text());if(!Array.isArray(parsed.bands)||!Array.isArray(parsed.shows)||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.finance))throw Error('Invalid backup');if(!parsed.bands.length)throw Error('No bands');data={...parsed,lang:['es','en'].includes(parsed.lang)?parsed.lang:'es',bandId:parsed.bands.some(b=>b.id===parsed.bandId)?parsed.bandId:parsed.bands[0].id};save();render()}catch(err){alert('Archivo inválido / Invalid file')}});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
