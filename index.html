en:{sub:'Management for bands',band:'Active band',addBand:'+ Band',home:'Home',shows:'Shows',tasks:'Tasks',finance:'Finances',settings:'Settings',save:'Save',cancel:'Cancel',next:'Upcoming shows',pending:'Pending tasks',balance:'Balance',sold:'Tickets sold',newShow:'+ Show',newTask:'+ Task',newFinance:'+ Transaction',noShows:'No shows yet. Add your first one.',noTasks:'No tasks yet.',noFinance:'No transactions yet.',date:'Date',venue:'Venue',capacity:'Capacity',goal:'Sales goal',tickets:'Tickets sold',ticketing:'Ticket platform(s)',ticketUrl:'Ticket link',name:'Name',due:'Due date',status:'Status',open:'Open',done:'Done',amount:'Amount',type:'Type',income:'Income',expense:'Expense',note:'Description',remove:'Delete',edit:'Edit',export:'Export backup',import:'Import backup',local:'Version 0.2 · Data is stored in this browser. No device sync.',lang:'Language',bands:'Bands',confirm:'Delete this record?',noDate:'No date',all:'Total shows',currency:'Currency (label)',paid:'Payments and transactions',help:'You can list several ticket platforms separated by commas. Sales are entered manually for now.',backup:'Back up regularly: clearing browser data may erase your information.',noSync:'Automatic ticket integration is not available yet.'}};

function render(){document.documentElement.lang=data.lang;$('#subtitle').textContent=t('sub');$('#bandLabel').textContent=t('band');$('#addBand').textContent=t('addBand');$('#band').innerHTML=data.bands.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('');$('#band').value=data.bandId;$('#foot').textContent=t('local');document.querySelectorAll('#nav button').forEach(b=>{b.textContent=t(b.dataset.tab);b.classList.toggle('active',b.dataset.tab===tab)});let shows=active('shows').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')),tasks=active('tasks'),fin=active('finance'),balance=fin.reduce((s,x)=>s+(x.type==='income'?1:-1)*Number(x.amount||0),0),sold=shows.reduce((s,x)=>s+Number(x.tickets||0),0);

function field(name,label,type='text',value='',extra=''){return `<label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function select(name,label,options,value){return `<label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select>`}
function modal(type,obj){formType=type;editing=obj?.id||null;$('#dialogTitle').textContent=type==='band'?t('addBand'):type==='show'?t('shows'):type==='task'?t('tasks'):t('finance');let f='';
if(type==='band')f=field('name',t('name'),'text',obj?.name,'required');
if(type==='show')f=field('name',t('name'),'text',obj?.name,'required')+field('date',t('date'),'date',obj?.date)+field('venue',t('venue'),'text',obj?.venue)+`<div class="formrow"><div>${field('capacity',t('capacity'),'number',obj?.capacity||0,'min="0"')}</div><div>${field('goal',t('goal'),'number',obj?.goal||0,'min="0"')}</div></div>`+field('tickets',t('tickets'),'number',obj?.tickets||0,'min="0"')+field('ticketing',t('ticketing'),'text',obj?.ticketing)+field('ticketUrl',t('ticketUrl'),'url',obj?.ticketUrl);
if(type==='task')f=field('name',t('name'),'text',obj?.name,'required')+field('due',t('due'),'date',obj?.due)+select('status',t('status'),[['open',t('open')],['done',t('done')]],obj?.status||'open');
if(type==='finance')f=field('note',t('note'),'text',obj?.note,'required')+field('date',t('date'),'date',obj?.date)+select('type',t('type'),[['income',t('income')],['expense',t('expense')]],obj?.type||'income')+field('amount',t('amount'),'number',obj?.amount||0,'min="0" step="0.01"')+select('currency',t('currency'),[['ARS','ARS'],['USD','USD'],['EUR','EUR'],['BRL','BRL']],obj?.currency||'ARS');
$('#fields').innerHTML=f;$('#saveBtn').textContent=t('save');$('#cancel').textContent=t('cancel');$('#dialog').showModal()}
$('#form').addEventListener('submit',e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target).entries());if(formType==='band'){const b={id:id(),name:vals.name.trim()};data.bands.push(b);data.bandId=b.id}else{let key={show:'shows',task:'tasks',finance:'finance'}[formType];if(!key)return;for(let k of ['capacity','goal','tickets','amount'])if(k in vals)vals[k]=Math.max(0,Number(vals[k])||0);let old=data[key].find(x=>x.id===editing);if(old)Object.assign(old,vals);else data[key].push({id:id(),bandId:data.bandId,...vals})}save();$('#dialog').close();render()});
$('#cancel').onclick=()=>$('#dialog').close();

$('#band').onchange=e=>{data.bandId=e.target.value;save();render()};
$('#addBand').onclick=()=>modal('band');
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action,key=b.dataset.id,types={Show:'shows',Task:'tasks',Finance:'finance'};if(a==='newBand')return modal('band');if(a==='newShow')return modal('show');if(a==='newTask')return modal('task');if(a==='newFinance')return modal('finance');if(a==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='band-manager-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(a==='import')return $('#importFile').click();if(a==='toggleTask'){let x=data.tasks.find(x=>x.id===key);if(x)x.status=x.status==='done'?'open':'done';save();return render()}for(let [suffix,collection] of Object.entries(types)){if(a==='edit'+suffix)return modal(suffix.toLowerCase()==='show'?'show':suffix.toLowerCase(),data[collection].find(x=>x.id===key));if(a==='delete'+suffix){if(confirm(t('confirm'))){data[collection]=data[collection].filter(x=>x.id!==key);save();render()}return}}});
$('#content').addEventListener('change',async e=>{if(e.target.id!=='importFile')return;try{let parsed=JSON.parse(await e.target.files[0].text());if(!Array.isArray(parsed.bands)||!Array.isArray(parsed.shows)||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.finance))throw Error('Invalid backup');if(!parsed.bands.length)throw Error('No bands');data={...parsed,lang:['es','en'].includes(parsed.lang)?parsed.lang:'es',bandId:parsed.bands.some(b=>b.id===parsed.bandId)?parsed.bandId:parsed.bands[0].id};save();render()}catch(err){alert('Archivo inválido / Invalid file')}});
data.lang='es';if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script>
<script>
// v0.4: ficha de producción en español, compatible con datos v0.3.
(()=>{
const KEY='bandmanager-v03-workspace';let store={};try{store=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(store));let current=null,section='menu';
const tabs=[['tickets','🎟','Entradas'],['expenses','💸','Gastos'],['discounts','🏷️','Descuentos'],['balance','🪙','Liquidación'],['transfers','💳','Transferencias'],['schedule','⏰','Horarios'],['staff','🎤','Personal y seguros'],['todo','📋','Tareas'],['set','🎸','Repertorio'],['guests','⭐','Invitados']];
const schemas={tickets:[['label','Tipo de entrada','text'],['platform','Ticketera','text'],['price','Precio unitario','number'],['qty','Vendidas','number']],expenses:[['label','Concepto','text'],['amount','Importe','number'],['owner','Responsable','text'],['status','Estado','select']],discounts:[['label','Concepto / motivo','text'],['amount','Importe ($)','number'],['owner','Observaciones','text']],transfers:[['label','Destinatario','text'],['amount','Importe ($)','number'],['owner','Referencia / observación','text']],schedule:[['time','Hora','time'],['label','Actividad','text'],['owner','Responsable','text'],['notes','Detalles / indicaciones','text']],staff:[['role','Función','text'],['name','Nombre y apellido','text'],['birth','Fecha de nacimiento','date'],['dni','DNI','text'],['insurance','Cobertura','select'],['notes','Observaciones','text']],todo:[['label','Tarea','text'],['owner','Responsable','text'],['status','Estado','select']],set:[['song','Canción','text'],['color','Color de luces','text'],['mood','Clima / escena','text'],['cue','Indicaciones de luces','text'],['notes','Notas para músicos','text']],guests:[['name','Nombre','text'],['qty','Cantidad','number'],['type','Tipo','text']]};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=x=>Math.max(0,Number(x)||0),money=x=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}).format(x||0);
const get=()=>store[current]??(store[current]={});const input=(key,label,type,value='',extra='')=>`<div><label>${label}</label><input name="${key}" type="${type}" value="${safe(value)}" ${extra}></div>`;
function formField(k,label,type){if(type==='select'){const options=k==='insurance'?['Pendiente','Sala / aseguradora propia','MeCubro','ART','No requiere / verificar']:['Pendiente','En proceso','Pagado','Realizada'];return `<div><label>${label}</label><select name="${k}">${options.map(x=>`<option>${x}</option>`).join('')}</select></div>`}return input(k,label,type,'',type==='number'?'min="0" step="any"':k==='dni'?'inputmode="numeric" autocomplete="off"':'')}
function totals(d){
 const gross=(d.tickets||[]).reduce((s,x)=>s+n(x.price)*n(x.qty),0);
 const cfg=d.config||{},pct=Math.min(100,n(cfg.venuePct)),discount=Math.min(100,n(cfg.discountPct));
 const generalDiscount=gross*discount/100, fixed=n(cfg.discountFixed);
 const itemDiscounts=(d.discounts||[]).reduce((s,x)=>s+n(x.amount),0);
 const disc=generalDiscount+fixed+itemDiscounts,base=gross-disc;
 // No truncar los descuentos: el saldo puede ser negativo (deuda).
 // La sala participa únicamente sobre una base positiva.
 const venue=Math.max(0,base)*pct/100,artist=base-venue;
 const cost=(d.expenses||[]).reduce((s,x)=>s+n(x.amount),0);
 const transfers=(d.transfers||[]).reduce((s,x)=>s+n(x.amount),0);
 return {gross,disc,base,venue,artist,cost,result:artist-cost,transfers,generalDiscount,fixed,itemDiscounts,pct,discount};
}
function open(id){current=id;section='menu';paint()}
function printSheet(kind){let sh=data.shows.find(x=>x.id===current),d=get(),title=kind==='schedule'?'CRONOGRAMA':kind==='set'?'SETLIST':'ILUMINACIÓN',rows=kind==='schedule'?[...(d.schedule||[])].sort((a,b)=>String(a.time||'').localeCompare(String(b.time||''))):d.set||[];
let body=kind==='schedule'?`<table><thead><tr><th>HORA</th><th>ACTIVIDAD</th><th>RESPONSABLE</th><th>DETALLES</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="time">${safe(r.time)}</td><td>${safe(r.label)}</td><td>${safe(r.owner)}</td><td>${safe(r.notes)}</td></tr>`).join('')}</tbody></table>`:kind==='set'?`<ol class="songs">${rows.map(r=>`<li><strong>${safe(r.song)}</strong>${r.notes?`<small>${safe(r.notes)}</small>`:''}</li>`).join('')}</ol>`:`<table><thead><tr><th>#</th><th>CANCIÓN</th><th>COLOR</th><th>ESCENA</th><th>CUE / INDICACIONES</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${safe(r.song)}</b></td><td>${safe(r.color)}</td><td>${safe(r.mood)}</td><td>${safe(r.cue)}</td></tr>`).join('')}</tbody></table>`;
let page=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${title}</title><style>@page{size:A4;margin:13mm}body{font-family:Arial,sans-serif;color:#111;margin:0}header{border-bottom:3px solid #111;padding-bottom:9px;margin-bottom:18px}h1{font-size:27px;margin:0}p{margin:5px 0}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#eee}th,td{border:1px solid #888;padding:10px 7px;vertical-align:top}tr{break-inside:avoid}.time{font-weight:800;font-size:16px;white-space:nowrap}.songs{font-size:26px;line-height:1.45;padding-left:42px}.songs li{padding:8px 0;border-bottom:1px solid #ddd;break-inside:avoid}.songs small{display:block;font-size:12px;font-weight:normal;color:#555;line-height:1.3}@media print{button{display:none}}</style></head><body><header><h1>${title}</h1><p>${safe(sh.name)} · ${safe(sh.venue||'')} · ${safe(sh.date||'')}</p></header>${body}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`;
const blob=new Blob([page],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${title.toLowerCase()}-${(sh.date||'show')}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);alert('Se descargó una hoja HTML lista para imprimir. Abrila y elegí Imprimir → Guardar como PDF, o imprimila directamente.');}
function paint(){const el=document.getElementById('showWorkspace'),main=document.getElementById('content');if(!current){el.classList.add('hide');main.classList.remove('hide');return}let sh=data.shows.find(x=>x.id===current);if(!sh){current=null;return paint()}const d=get();main.classList.add('hide');el.classList.remove('hide');let out=`<div class="sectortop"><button data-act="back">◀ CONCIERTOS</button><span class="pixelbadge">FICHA DE FECHA</span></div><h1>${safe(sh.name)}</h1><p class="muted">${safe(sh.date||'Sin fecha')} · ${safe(sh.venue||'Sin sala')}</p>`;
if(section==='menu'){out+=`<div class="sectors">${tabs.map(([k,icon,label])=>`<button class="sector" data-act="section" data-key="${k}"><strong>${icon} ${label}</strong><span>▶ ENTRAR</span></button>`).join('')}</div><div class="card"><p>Completá los sectores de la fecha. Las hojas de horarios y repertorio se pueden imprimir.</p></div>`}
else{out+=`<div class="sectortop"><button data-act="menu">◀ SECTORES</button><span class="pixelbadge">${tabs.find(x=>x[0]===section)?.[2]}</span></div>`;
if(section==='tickets'){let cfg=d.config||{},t=totals(d);out+=`<div class="card"><h2>Condiciones generales de la fecha</h2><p class="sectionhelp">Se aplican una sola vez al total de entradas, no a cada categoría.</p><form id="configForm" class="lineform">${input('venuePct','Porcentaje de la sala (%)','number',cfg.venuePct??0,'min="0" max="100" step="any"')}${input('discountPct','Descuento general (%)','number',cfg.discountPct??0,'min="0" max="100" step="any"')}${input('discountFixed','Otros descuentos fijos ($)','number',cfg.discountFixed??0,'min="0" step="any"')}<button class="primary">GUARDAR CONDICIONES</button></form></div>`}
if(section==='balance'){
 const t=totals(d),rows=d.tickets||[],costs=d.expenses||[],discounts=d.discounts||[],transfers=d.transfers||[];
 const line=(name,value,klass='')=>`<div class="ledgerline ${klass} ${value<0?'debit':''}"><span>${safe(name)}</span><strong>${value<0?'−$ '+money(Math.abs(value)):'$ '+money(value)}</strong></div>`;
 out+=`<div class="summarybox"><div class="mini">RESULTADO ESTIMADO DE LA FECHA</div><div class="number ${t.result<0?'negative':''}">$ ${money(t.result)}</div><p class="mini">Recaudación neta para la banda, menos gastos. Transferencias: registro de pagos, no se restan dos veces.</p></div>`;
 out+=`<div class="card"><div class="financehead">01 · Ingresos por entradas</div><div class="tablewrap"><table class="financial-table"><thead><tr><th>Promo / tipo</th><th>Precio</th><th>Vendidas</th><th>Bruto</th><th>Sala ${money(t.pct)}%</th><th>Banda</th></tr></thead><tbody>${rows.map(r=>{let gross=n(r.price)*n(r.qty),net=t.gross?gross/t.gross*t.base:0;return `<tr><td>${safe(r.label)}</td><td>$ ${money(n(r.price))}</td><td>${money(n(r.qty))}</td><td>$ ${money(gross)}</td><td>$ ${money(net*t.pct/100)}</td><td>$ ${money(net*(1-t.pct/100))}</td></tr>`}).join('')}</tbody></table></div>${line('RECAUDACIÓN BRUTA',t.gross,'total')}${line('Descuento general ('+money(t.discount)+'%)',-t.generalDiscount)}${line('Descuento fijo general',-t.fixed)}${discounts.map(r=>line(r.label,-n(r.amount))).join('')}${line('TOTAL DESCUENTOS APLICADOS',-t.disc)}${line('NETO A REPARTIR',t.base,'total')}${line('PARTE DE LA SALA',t.venue)}${line('INGRESO PARA LA BANDA',t.artist,'total')}</div>`;
 out+=`<div class="ledger"><div class="card"><div class="financehead">02 · Gastos de producción</div>${costs.map(r=>line(r.label+(r.owner?' · '+r.owner:''),n(r.amount))).join('')||'<p class="mini">Sin gastos cargados.</p>'}${line('TOTAL GASTOS',-t.cost,'total')}</div><div class="card"><div class="financehead">03 · Balance y pagos</div>${line('Ingreso para la banda',t.artist)}${line('Gastos',-t.cost)}${line('RESULTADO DE LA FECHA',t.result,'total')}${t.result<0?`<div class="debtalert">DEUDA / DÉFICIT: $ ${money(Math.abs(t.result))}</div>`:''}<br><div class="financehead">Transferencias registradas</div>${transfers.map(r=>line(r.label,n(r.amount))).join('')||'<p class="mini">Sin transferencias cargadas.</p>'}${line('TOTAL TRANSFERIDO',t.transfers,'total')}<p class="mini">Los pagos registrados no se descuentan automáticamente del resultado: pueden ser pagos de gastos ya contabilizados o repartos de ganancias.</p></div></div>`;
 out+=`<div class="card"><h2>Condiciones de liquidación</h2><p class="sectionhelp">Estas condiciones afectan todas las categorías de entradas. Editalas desde Entradas.</p><p class="mini">Fórmula: bruto − descuentos (sin límite) → reparto de saldo positivo con la sala → parte de la banda − gastos. Si los descuentos superan los ingresos, el déficit se muestra como deuda de la banda, sin aplicar porcentaje de sala sobre números negativos. El reparto por categoría es proporcional al neto luego de descuentos generales. Cálculo orientativo: verificá impuestos, SADAIC, cargos de ticketera y acuerdos particulares.</p><button data-act="section" data-key="tickets">🎟 EDITAR CONDICIONES</button><button data-act="section" data-key="discounts">🏷️ CARGAR DESCUENTOS</button><button data-act="section" data-key="expenses">💸 CARGAR GASTOS</button><button data-act="section" data-key="transfers">💳 REGISTRAR PAGOS</button></div>`;
}

else{let cols=schemas[section],rows=d[section]||[];if(section==='staff')out+=`<div class="card"><h2>Seguros del personal</h2><p>Indicá quién está cubierto por la sala, quién necesita un seguro externo y quién tiene ART. El seguro NO se contrata desde esta aplicación.</p><p><a href="https://mecubro.com/ar/ap/contrata-seguro-de-accidentes-personales-para-artistas" target="_blank" rel="noopener noreferrer">ABRIR MECUBRO ↗</a></p><p class="sectionhelp">DNI y nacimiento son datos personales: quedan en este navegador, sin envío automático. No los cargues en equipos compartidos. Verificá la cobertura con la sala o aseguradora antes del show.</p></div>`;
if(section==='schedule')out+=`<div class="actions"><button class="primary" data-act="print" data-kind="schedule">⬇ DESCARGAR CRONOGRAMA PARA IMPRIMIR</button></div>`;
if(section==='set')out+=`<div class="actions"><button class="primary" data-act="print" data-kind="set">⬇ SETLIST PARA MÚSICOS</button><button class="primary" data-act="print" data-kind="lights">⬇ HOJA DE ILUMINACIÓN</button></div>`;
out+=`<div class="card"><h2>Agregar registro</h2><form id="v4form" class="lineform">${cols.map(c=>formField(...c)).join('')}<button class="primary">＋ AGREGAR</button></form></div><div class="card"><h2>Registros (${rows.length})</h2><div class="tablewrap"><table class="tinytable"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(([k])=>`<td>${k==='qty'&&section==='tickets'?`<input class="inlineqty" aria-label="Cantidad vendida" type="number" min="0" step="1" data-row="${i}" value="${safe(r[k]||0)}">`:k==='dni'?`<span title="DNI guardado localmente">${r[k]?'••••'+safe(String(r[k]).slice(-3)):'—'}</span>`:safe(r[k])}</td>`).join('')}<td><button data-act="del" data-row="${i}" aria-label="Eliminar">×</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<p class="sectionhelp">Todavía no hay registros.</p>'}</div>`;
if(section==='tickets')out+=`<div class="card">TOTAL VENDIDAS: <b>${(d.tickets||[]).reduce((s,x)=>s+n(x.qty),0)}</b> · BRUTO: <b>$ ${money(totals(d).gross)}</b><p class="sectionhelp">Modificá directamente la cantidad vendida de cada grupo y el balance se actualizará.</p></div>`;
}}
el.innerHTML=out}
const el=document.getElementById('showWorkspace');el.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a==='back'){current=null;render();paint()}else if(a==='menu'){section='menu';paint()}else if(a==='section'){section=b.dataset.key;paint()}else if(a==='del'){if(confirm('¿Eliminar este registro?')){get()[section].splice(+b.dataset.row,1);save();paint()}}else if(a==='print')printSheet(b.dataset.kind)});
el.addEventListener('submit',e=>{if(!['v4form','configForm'].includes(e.target.id))return;e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());if(e.target.id==='configForm'){if(n(obj.venuePct)>100||n(obj.discountPct)>100)return alert('Los porcentajes deben estar entre 0 y 100.');get().config=obj}else{get()[section]??=[];get()[section].push(obj)}save();paint()});
el.addEventListener('change',e=>{let x=e.target;if(!x.matches('.inlineqty'))return;let qty=Number(x.value);if(!Number.isInteger(qty)||qty<0)return alert('Ingresá una cantidad válida.');get().tickets[+x.dataset.row].qty=qty;save();paint()});
const content=document.getElementById('content');new MutationObserver(()=>{content.querySelectorAll('[data-action="editShow"]').forEach(btn=>{if(btn.previousElementSibling?.dataset?.openShow)return;let go=document.createElement('button');go.textContent='🎮 FICHA DEL CONCIERTO';go.dataset.openShow='1';go.className='primary';go.onclick=()=>open(btn.dataset.id);btn.parentNode.insertBefore(go,btn)})}).observe(content,{childList:true,subtree:true});
})();
</script></body></html>
